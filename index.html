<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💘 Valentine 💘</title>
  <style>
    :root{
      --bg1:#ff758c;
      --bg2:#ff7eb3;
      --card: rgba(255,255,255,0.16);
      --border: rgba(255,255,255,0.28);
      --text: #ffffff;
      --accent: #ff3d6a;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg2), var(--bg1) 55%, #fbc2eb);
      text-align:center;
    }
    .card{
      width:min(720px, 92vw);
      padding: 34px 22px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 24px 70px rgba(0,0,0,0.22);
      backdrop-filter: blur(10px);
      position: relative;
    }
    h1{
      margin:0 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: 0.2px;
    }
    p{
      margin: 6px 0 0;
      font-size: clamp(18px, 2.6vw, 22px);
      opacity: 0.95;
      line-height: 1.35;
    }
    .timerWrap{
      margin: 18px auto 0;
      display:inline-flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content:center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.10);
      font-weight: 700;
    }
    .timerWrap span{
      display:inline-block;
      min-width: 2ch;
    }
    .btnRow{
      margin-top: 24px;
      display:flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content:center;
      align-items:center;
      position: relative;
    }
    button{
      border: 0;
      cursor: pointer;
      padding: 14px 22px;
      font-size: 18px;
      border-radius: 999px;
      background: #fff;
      color: var(--accent);
      font-weight: 800;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      user-select:none;
    }
    button:hover{ transform: scale(1.05); }
    button:active{ transform: scale(0.98); }

    /* "No" button will be absolutely positioned inside .btnRow */
    .noBtn{
      position: absolute;
    }

    /* typewriter caret */
    .caret{
      display:inline-block;
      width:10px;
      margin-left:4px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink{ 50% { opacity: 0; } }

    /* floating hearts */
    .heart{
      position:absolute;
      bottom:-40px;
      opacity:.78;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.18));
      pointer-events:none;
    }
    @keyframes floatUp{
      from{ transform: translateY(0) translateX(0) rotate(0deg); }
      to{ transform: translateY(-110vh) translateX(40px) rotate(25deg); }
    }

    /* confetti */
    .confetti{
      position:absolute;
      width:10px;
      height:10px;
      top:-20px;
      animation: fall 2.8s linear forwards;
      pointer-events:none;
    }
    @keyframes fall{
      to{ transform: translateY(110vh) rotate(720deg); opacity: 0.95; }
    }

    .small{
      font-size: 14px;
      opacity: 0.85;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title"></h1>
    <p id="subtitle"></p>

    <div class="timerWrap" id="timerWrap" style="display:none;">
      ⏳ Valentine’s in
      <span id="dd">00</span>d
      <span id="hh">00</span>h
      <span id="mm">00</span>m
      <span id="ss">00</span>s
      <span class="small" id="sgtNote" style="display:none;">(Singapore time)</span>
    </div>

    <div class="btnRow" id="buttons"></div>
  </div>

<script>
  // ---------- CONFIG ----------
  // Singapore time (SGT) is UTC+8 and does not observe daylight savings.
  // Countdown target: 14 Feb at 00:00:00 Singapore time (start of the day).
  function valentineTargetSGT() {
    const now = new Date();
    const year = now.getFullYear();
    // If it's already past Feb 14 this year (in SGT), target next year.
    const targetThisYear = new Date(Date.UTC(year, 1, 13, 16, 0, 0)); // Feb 14 00:00 SGT == Feb 13 16:00 UTC
    const nowUtc = new Date();
    return (nowUtc.getTime() > targetThisYear.getTime())
      ? new Date(Date.UTC(year + 1, 1, 13, 16, 0, 0))
      : targetThisYear;
  }

  const steps = [
    {
      t: "Hi beautiful 💖",
      s: "I made something for you…",
      showTimer: false,
      buttons: [{ label: "Next", action: "next" }]
    },
    {
      t: "A special day is coming… ✨",
      s: "So I thought I’d ask you properly 😁",
      showTimer: true,
      buttons: [{ label: "Next", action: "next" }]
    },
    {
      t: "Will you be my Valentine? 💘",
      showTimer: true,
      buttons: [
        { label: "Yes", action: "yes" },
        { label: "No", action: "no" }
      ]
    }
  ];

  // ---------- DOM ----------
  const titleEl = document.getElementById("title");
  const subEl = document.getElementById("subtitle");
  const btnRow = document.getElementById("buttons");
  const timerWrap = document.getElementById("timerWrap");
  const dd = document.getElementById("dd");
  const hh = document.getElementById("hh");
  const mm = document.getElementById("mm");
  const ss = document.getElementById("ss");
  const sgtNote = document.getElementById("sgtNote");

  let idx = 0;
  const target = valentineTargetSGT();

  // ---------- TYPEWRITER ----------
  function typeText(el, text, speed = 24) {
    return new Promise(resolve => {
      el.textContent = "";
      const caret = document.createElement("span");
      caret.className = "caret";
      caret.textContent = "|";
      el.appendChild(caret);

      let i = 0;
      const timer = setInterval(() => {
        caret.remove();
        el.textContent = text.slice(0, i + 1);
        el.appendChild(caret);
        i++;
        if (i >= text.length) {
          clearInterval(timer);
          caret.remove();
          resolve();
        }
      }, speed);
    });
  }

  // ---------- TIMER (SGT TARGET, computed in UTC) ----------
  function pad2(n){ return String(n).padStart(2,"0"); }

  function updateCountdown() {
    const now = new Date().getTime();
    let diff = target.getTime() - now;

    if (diff <= 0) {
      dd.textContent = "00";
      hh.textContent = "00";
      mm.textContent = "00";
      ss.textContent = "00";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;

    dd.textContent = pad2(days);
    hh.textContent = pad2(hours);
    mm.textContent = pad2(mins);
    ss.textContent = pad2(secs);
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  // ---------- RENDER ----------
  async function render() {
    const step = steps[idx];
    btnRow.innerHTML = "";

    // timer visibility
    timerWrap.style.display = step.showTimer ? "inline-flex" : "none";
    sgtNote.style.display = step.showTimer ? "inline" : "none";

    await typeText(titleEl, step.t, 26);
    subEl.textContent = step.s;

    step.buttons.forEach(b => {
      const btn = document.createElement("button");
      btn.textContent = b.label;

      if (b.action === "next") btn.onclick = next;
      if (b.action === "yes") btn.onclick = celebrate;
      if (b.action === "no") {
        btn.classList.add("noBtn");
        btn.id = "noBtn";
        // We'll place it after buttons render
        btn.onclick = () => {}; // no action
      }

      btnRow.appendChild(btn);
    });

    // After creating buttons, set up dodging if needed
    const noBtn = document.getElementById("noBtn");
    if (noBtn) {
      positionNoButton(noBtn);
      enableNoDodge(noBtn);
    }
  }

  function next() {
    idx = Math.min(idx + 1, steps.length - 1);
    render();
  }

  // ---------- NO BUTTON DODGE ----------
  function positionNoButton(noBtn){
    // Place the No button near the Yes button but not overlapping
    const yesBtn = Array.from(btnRow.querySelectorAll("button")).find(b => b.textContent.trim() === "Yes");
    if (!yesBtn) return;

    // Ensure btnRow has some height for absolute positioning
    btnRow.style.minHeight = "70px";

    const rowRect = btnRow.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();

    // Initial position: to the right of Yes if possible, else below.
    const desiredLeft = (yesRect.left - rowRect.left) + yesRect.width + 16;
    const desiredTop = (yesRect.top - rowRect.top);

    noBtn.style.left = Math.min(desiredLeft, rowRect.width - noBtn.offsetWidth - 8) + "px";
    noBtn.style.top  = Math.min(desiredTop, rowRect.height - noBtn.offsetHeight - 8) + "px";
  }

  function enableNoDodge(noBtn){
    const safePadding = 10;

    function moveNo(){
      const rowRect = btnRow.getBoundingClientRect();
      const btnW = noBtn.offsetWidth;
      const btnH = noBtn.offsetHeight;

      // random positions inside btnRow
      const maxX = Math.max(safePadding, rowRect.width - btnW - safePadding);
      const maxY = Math.max(safePadding, rowRect.height - btnH - safePadding);

      const x = safePadding + Math.random() * (maxX - safePadding);
      const y = safePadding + Math.random() * (maxY - safePadding);

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Dodge when mouse gets close
    btnRow.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();
      const dx = (e.clientX - (rect.left + rect.width/2));
      const dy = (e.clientY - (rect.top + rect.height/2));
      const dist = Math.hypot(dx, dy);
      if (dist < 90) moveNo();
    });

    // Also dodge on hover/focus (mobile-ish)
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("focus", moveNo);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNo(); }, {passive:false});
  }

  // ---------- CELEBRATION + TYPED NOTE ----------
  function burstConfetti(n){
    for(let i=0;i<n;i++){
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random()*100 + "vw";
      c.style.background = `hsl(${Math.random()*360}, 100%, 75%)`;
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      c.style.animationDuration = (2 + Math.random()*1.8) + "s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 5200);
    }
  }

  async function celebrate(){
    timerWrap.style.display = "none";

    titleEl.textContent = "YAYYYY 🎉💖";
    subEl.textContent = "";
    btnRow.innerHTML = "";

    burstConfetti(140);

    // Type out the note
    await typeText(subEl, "I like you a ridiculous amount.", 34);

    // Optional replay button
    const replay = document.createElement("button");
    replay.textContent = "Replay";
    replay.onclick = () => location.reload();
    btnRow.appendChild(replay);
  }

  // ---------- AMBIENCE ----------
  function spawnHearts(){
    const emojis = ["💖","💘","💕","💗","💓"];
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = Math.random()*100 + "vw";
    h.style.animationDuration = (5 + Math.random()*4) + "s";
    h.style.fontSize = (18 + Math.random()*18) + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 10000);
  }
  setInterval(spawnHearts, 380);

  // ---------- START ----------
  render();
</script>
</body>
</html>
